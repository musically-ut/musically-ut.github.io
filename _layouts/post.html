---
layout: default
---
<div class="post">

  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-meta">{{ page.date | date: "%b %-d, %Y" }}{% if page.author %} • {{ page.author }}{% endif %}{% if page.meta %} • {{ page.meta }}{% endif %}</p>
  </header>

  <article class="post-content">
    {{ content }}
  </article>

</div>

<!-- Tufte sidenotes: promote kramdown's markdown footnotes into the right
     margin on wide screens. No effect on the markdown you write, on RSS, or
     when JS is off (the footnotes list at the bottom stays as the fallback). -->
<script src="{{ "/js/sidenotes.js" | prepend: site.baseurl }}"></script>
